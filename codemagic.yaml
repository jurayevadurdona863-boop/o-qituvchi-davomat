workflows:
  android-capacitor-build:
    name: Android Capacitor Build Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      java: 21
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
          npm install -D @capacitor/cli @capacitor/core @capacitor/android --legacy-peer-deps
      - name: Build web project
        script: |
          npm run build
      - name: Prepare Android Platform
        script: |
          npx cap add android || true
          npx cap sync android
          # Android Manifest fayliga GPS ruxsatlarini avtomatik qo'shish:
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '' '/<uses-permission android:name="android.permission.INTERNET" \/>/a \
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>\
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" \/>' "$MANIFEST"
          fi
      - name: Build Android APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
