workflows:
  android-capacitor-build:
    name: Android Capacitor Build Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Build web project
        script: |
          npm run build
      - name: Initialize Capacitor Android with AppId
        script: |
          npx --yes @capacitor/cli init "O Qituvchi Davomat" "com.oqituvchi.davomat" --web-dir dist || true
          npx --yes @capacitor/cli add android || true
          npx --yes @capacitor/cli sync android
      - name: Build Android APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
